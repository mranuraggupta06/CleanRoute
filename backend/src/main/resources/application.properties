server.port=${PORT:8080}

# H2 in-memory database (data persists as long as server runs; swap for PostgreSQL for production)
spring.datasource.url=jdbc:h2:file:./data/cleanroutedb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false

# CSV data folder
app.data-dir=./data

# JWT secret (change in production!)
app.jwt.secret=CleanRouteSecretKey2024ChangeThisInProductionPlease
app.jwt.expiration=86400000

# Max photo size (600 KB)
spring.servlet.multipart.max-file-size=600KB
spring.servlet.multipart.max-request-size=1MB

# CORS — update FRONTEND_URL env var on Render to your Vercel URL
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

logging.level.com.cleanroute=INFO
